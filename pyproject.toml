[project]
name = "neovpn"
version = "0.1.0"
description = "Telegram-first VPN subscription platform with Marzban backend."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NeoVPN Contributors" }]
dependencies = [
    "aiogram>=3.3,<4",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.32",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0.32,<3",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<2",
    "redis>=5.0,<6",
    "httpx>=0.27,<0.28",
    "qrcode>=7.4,<8",
    "pillow>=10.4,<12",
    "python-jose[cryptography]>=3.3,<4",
    "structlog>=24.4,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2",
    "types-redis>=4.6,<5",
    "aiosqlite>=0.20,<0.21",
]

[project.scripts]
neovpn-bot = "neovpn.bot.__main__:main"
neovpn-api = "neovpn.api.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neovpn"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "B", "UP", "C4", "SIM", "RUF", "ASYNC", "S", "T20",
]
ignore = [
    "S101",    # assert allowed in tests
    "S105",    # hardcoded password checks produce noise in tests
    "RUF001",  # cyrillic look-alikes in UI copy
    "RUF002",  # cyrillic look-alikes in docstrings
    "RUF003",  # cyrillic look-alikes in comments
    "N811",    # SQLAlchemy dialect UUID alias (PgUUID)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"alembic/**" = ["T20", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["qrcode.*", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/neovpn"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
